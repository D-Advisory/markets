<!--
  D-Advisory Markets & Economy: WordPress embed
  Paste everything below into a "Custom HTML" block on your WordPress page.
  Replace YOUR-GITHUB-USERNAME with your GitHub username (and the repository
  name if you chose a different one than "markets").
  The frame resizes itself to fit the dashboard, so visitors never see a
  second scroll bar.
-->
<div class="dadv-markets" style="width:100%;margin:0 auto;">
  <iframe id="dadv-markets-frame"
          src="https://YOUR-GITHUB-USERNAME.github.io/markets/"
          title="Markets &amp; Economy dashboard"
          style="width:100%;height:2200px;border:0;display:block;"
          loading="lazy"></iframe>
</div>
<script>
  (function () {
    var frame = document.getElementById('dadv-markets-frame');
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'dadv-markets-height') return;
      if (e.source !== frame.contentWindow) return;
      frame.style.height = Math.max(600, Math.ceil(e.data.height) + 20) + 'px';
    });
  })();
</script>
